/* Wright Maths Tuition — brand stylesheet */

:root{
  --navy:#0f2440;
  --navy-dark:#081627;
  --navy-mid:#1c3a5e;
  --gold:#c19a49;
  --gold-light:#e4c886;
  --paper:#f8f5ee;
  --paper-dim:#efe9db;
  --ink:#1b2430;
  --ink-soft:#4a5568;
  --line:#dfd8c4;
  --white:#ffffff;
  --radius:10px;
  --maxw:1120px;
  --shadow:0 10px 30px -12px rgba(15,36,64,0.18);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Source Sans 3", -apple-system, Segoe UI, Roboto, sans-serif;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:"Fraunces", Georgia, "Times New Roman", serif;
  color:var(--navy);
  line-height:1.15;
  margin:0 0 .5em;
  font-weight:600;
}
h1{font-size:clamp(2.1rem,4vw,3.1rem);}
h2{font-size:clamp(1.5rem,2.6vw,2rem);}
h3{font-size:1.2rem;}
p{margin:0 0 1em;color:var(--ink-soft);}
a{color:var(--navy-mid);}
a:hover{color:var(--gold);}
img{max-width:100%;display:block;}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

/* Header */
.site-header{
  background:var(--navy);
  color:var(--white);
  position:sticky;top:0;z-index:50;
  border-bottom:3px solid var(--gold);
}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white);}
.brand svg{width:42px;height:42px;flex:none;}
.brand-text{line-height:1.2;}
.brand-text .name{font-family:"Fraunces",serif;font-weight:600;font-size:1.25rem;color:var(--white);}
.brand-text .tag{font-size:.78rem;letter-spacing:.03em;color:var(--gold-light);}
nav.mainnav ul{list-style:none;display:flex;gap:26px;margin:0;padding:0;flex-wrap:wrap;}
nav.mainnav a{color:var(--white);text-decoration:none;font-size:.96rem;font-weight:600;letter-spacing:.01em;padding:6px 2px;border-bottom:2px solid transparent;}
nav.mainnav a:hover,nav.mainnav a[aria-current="page"]{color:var(--gold-light);border-bottom-color:var(--gold);}
.header-cta{background:var(--gold);color:var(--navy-dark);padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap;}
.header-cta:hover{background:var(--gold-light);color:var(--navy-dark);}

/* Hero */
.hero{background:linear-gradient(155deg,var(--navy) 0%,var(--navy-dark) 65%);color:var(--white);padding:76px 0 84px;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(198,154,73,0.18),transparent 70%);}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;}}
.eyebrow{display:inline-block;background:rgba(198,154,73,0.15);color:var(--gold-light);border:1px solid rgba(198,154,73,0.4);padding:5px 14px;border-radius:999px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:18px;}
.hero p.lead{color:#d9e0ea;font-size:1.12rem;max-width:52ch;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font-weight:700;text-decoration:none;font-size:.98rem;border:2px solid transparent;}
.btn-gold{background:var(--gold);color:var(--navy-dark);}
.btn-gold:hover{background:var(--gold-light);color:var(--navy-dark);}
.btn-ghost{border-color:rgba(255,255,255,0.5);color:var(--white);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-light);}
.btn-navy{background:var(--navy);color:var(--white);}
.btn-navy:hover{background:var(--navy-mid);}

.hero-badges{display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:var(--radius);padding:22px;backdrop-filter:blur(2px);}
.hero-badges .badge{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;color:#e7ecf3;}
.hero-badges .badge b{display:block;color:var(--white);font-size:.96rem;}
.hero-badges svg{flex:none;width:22px;height:22px;color:var(--gold);}

/* Section */
section{padding:64px 0;}
.section-alt{background:var(--paper-dim);}
.section-navy{background:var(--navy);color:var(--white);}
.section-navy h2{color:var(--white);}
.section-navy p{color:#c9d3e0;}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;font-weight:700;color:var(--gold);margin-bottom:10px;display:block;}
.section-head{max-width:70ch;margin-bottom:38px;}

.grid{display:grid;gap:26px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:820px){.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);}
.card h3{margin-bottom:.4em;}
.card .lvl-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--paper-dim);color:var(--navy);border:1px solid var(--line);padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.card.favoured{border-color:var(--gold);position:relative;}
.card.favoured::before{content:"Speciality";position:absolute;top:-12px;right:18px;background:var(--gold);color:var(--navy-dark);font-size:.7rem;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:999px;text-transform:uppercase;}

ul.tick{list-style:none;margin:0;padding:0;}
ul.tick li{position:relative;padding-left:28px;margin-bottom:10px;color:var(--ink-soft);}
ul.tick li::before{content:"✓";position:absolute;left:0;top:0;color:var(--gold);font-weight:800;}

/* Resource lists */
.res-group{margin-bottom:44px;}
.res-group h3{border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
@media (max-width:700px){.res-list{grid-template-columns:1fr;}}
.res-item{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.res-item a{font-weight:700;text-decoration:none;color:var(--navy);}
.res-item a:hover{color:var(--gold);}
.res-item p{margin:.35em 0 0;font-size:.92rem;}

/* Timeline (about) */
.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--gold);}
.timeline li{position:relative;padding:0 0 26px 26px;}
.timeline li::before{content:"";position:absolute;left:-9px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);}
.timeline .yr{font-weight:800;color:var(--navy);display:block;font-size:.85rem;letter-spacing:.03em;}

.dbs-strip{display:flex;align-items:center;gap:18px;background:var(--white);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);}
.dbs-strip svg{flex:none;width:38px;height:38px;color:var(--navy);}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media (max-width:820px){.contact-grid{grid-template-columns:1fr;}}
.contact-block{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
.contact-line{display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:1.02rem;}
.contact-line svg{flex:none;width:22px;height:22px;color:var(--gold);}
.contact-line a{font-weight:700;color:var(--navy);text-decoration:none;}
.contact-line a:hover{color:var(--gold);}
form.mail-form label{display:block;font-weight:700;margin:14px 0 6px;font-size:.9rem;color:var(--navy);}
form.mail-form input,form.mail-form textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.98rem;background:var(--paper);}
form.mail-form textarea{min-height:120px;resize:vertical;}
form.mail-form button{margin-top:18px;}

/* Footer */
footer{background:var(--navy-dark);color:#aab6c6;padding:42px 0 28px;font-size:.9rem;}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}
footer a{color:#cfd8e4;}
footer a:hover{color:var(--gold-light);}
footer .fcol h4{color:var(--white);font-family:"Fraunces",serif;font-size:1rem;margin-bottom:10px;}
footer .fcol ul{list-style:none;margin:0;padding:0;}
footer .fcol li{margin-bottom:6px;}
.legal{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);font-size:.82rem;color:#7c8aa0;text-align:center;}

.areas{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.areas span{background:var(--paper-dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--navy);}

/* mobile nav toggle (simple, CSS only fallback: stack) */
@media (max-width:700px){
  nav.mainnav ul{gap:14px;font-size:.88rem;}
  .site-header .wrap{flex-direction:column;align-items:flex-start;}
}
