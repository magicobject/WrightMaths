<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>data-print-if fixture</title></head>
<body>
<main>
<h1>Conditions</h1>
<p data-print-if="alpha">Only with alpha.</p>
<p data-print-if="alpha beta">Only with alpha and beta.</p>
<p>Always <span data-print-if="beta">and beta only</span> here.</p>
<ul><li data-print-if="alpha">Item with alpha</li><li>Item always</li></ul>
</main>
</body>
</html>
